name: Portable interview workspace
on:
  # Ordinary feature pushes are covered by their pull requests.
  push:
    branches: [main, feat/interviewcheck-production]
    paths: ["portable/**", "server/**", "scripts/**", "package.json", ".github/workflows/portable.yml", "deploy/**", ".dockerignore"]
  pull_request:
    paths: ["portable/**", "server/**", "scripts/**", "package.json", ".github/workflows/portable.yml", "deploy/**", ".dockerignore"]
  workflow_dispatch:

permissions:
  contents: read

# Supersede older runs only when testing updates to the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: portable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            portable/qa/requirements.txt
            portable/requirements-dev.txt
            portable/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            portable/web/package-lock.json
            server/package-lock.json
      - run: python -m pip install -r qa/requirements.txt
      - run: npm ci --prefix ../server --ignore-scripts
      - run: npm run build --prefix ../server
      - run: npm test --prefix ../server
      - run: python run.py --build-only
      - run: python qa/smoke_next.py
      - run: npm run typecheck --prefix web
      - run: python evaluate.py
      - run: python -m pytest tests -q
      # Browsers only; the key follows the Playwright pin, and Linux system packages still install below.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('portable/qa/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: python -m playwright install chromium
        if: runner.os == 'Windows'
      - run: python -m pytest qa -q --frontend=start
      - run: python -m pytest qa/test_session_lifecycle.py qa/test_capture.py qa/test_webhook_transport.py qa/test_connected_ui.py::test_admin_grants_access_through_account_page -q --frontend=dev
      - run: python -m pytest qa/test_browser.py -q --frontend=static
      - run: python package_release.py ../build/InterviewCheck-portable.zip
      - run: python qa/smoke_archive.py ../build/InterviewCheck-portable.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: InterviewCheck-portable-${{ matrix.os }}
          path: build/InterviewCheck-portable.zip
          if-no-files-found: error

  # The tests above run on the CI machine's own Python and SQLite. This job starts the real server image
  # (deploy/Dockerfile): first main's image on an empty data folder, then this branch's image on that same
  # folder, so a PR that cannot start, or cannot upgrade main's database, fails here instead of in a deploy.
  server-image:
    name: Server image starts and upgrades main's data
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.base_ref }}
          path: .base
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build main's image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .base
          file: .base/deploy/Dockerfile
          load: true
          provenance: false
          tags: interviewcheck-web:base
          cache-from: type=gha
      - name: Build this branch's image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          provenance: false
          build-args: GIT_SHA=${{ github.event.pull_request.head.sha }}
          tags: interviewcheck-web:new
          cache-from: type=gha
      - run: deploy/image-smoke.sh interviewcheck-web:base interviewcheck-web:new
      # deploy/Caddyfile under the pinned Caddy, in front of this image: what production runs, over local HTTP.
      - run: deploy/edge-smoke.sh interviewcheck-web:new
