name: Portable interview workspace
on:
  push:
    paths: ["portable/**", "server/**", ".github/workflows/portable.yml"]
  pull_request:
    paths: ["portable/**", "server/**", ".github/workflows/portable.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: portable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portable/web/package-lock.json
      - run: python -m pip install -r qa/requirements.txt
      - run: npm ci --prefix ../server --ignore-scripts
      - run: npm run build --prefix ../server
      - run: python run.py --build-only
      - run: npm run typecheck --prefix web
      - run: python evaluate.py
      - run: python -m pytest tests -q
      - run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: python -m playwright install chromium
        if: runner.os == 'Windows'
      - run: python -m pytest qa -q
      - run: python package_release.py ../build/InterviewCheck-portable.zip
      - run: python qa/smoke_archive.py ../build/InterviewCheck-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: InterviewCheck-portable-${{ matrix.os }}
          path: build/InterviewCheck-portable.zip
          if-no-files-found: error
