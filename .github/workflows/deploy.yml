name: Deploy web workspace
# Every merge to main that passes the Linux CI job is built into an image, pushed to
# Azure Container Registry and rolled out on the VM (deploy/vm-rollout.sh). The Windows
# job does not gate deploys: production runs Linux, and that job has flaky upload tests.
# Setup: deploy/provision-azure.sh. Manual run: Actions → Deploy web workspace → Run workflow.
on:
  workflow_run:
    workflows: ["Portable interview workspace"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.SITE_ADDRESS }}
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/interviewcheck-web:${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require the Linux CI job to have passed
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          result=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name | test("ubuntu")) | .conclusion] | unique | join(",")')
          echo "Linux CI: $result"
          [ "$result" = "success" ] || { echo "::error::Linux CI did not pass for $SHA; not deploying."; exit 1; }

      # Runs are serialized but not ordered: a slow CI run for an older commit must not deploy over a
      # newer one. Skip when main has moved on with a change that runs CI itself (and so deploys after
      # this). A newer commit that only touches files outside CI's paths starts no deploy, so this one
      # still goes out. Keep the pattern in step with `paths` in portable.yml.
      - name: Deploy only the newest deployable commit on main
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PATHS: '^(portable/|server/|scripts/|deploy/|package\.json$|\.github/workflows/portable\.yml$|\.dockerignore$)'
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          compare=$(gh api "repos/${{ github.repository }}/compare/$SHA...$tip")
          status=$(jq -r .status <<<"$compare")
          count=$(jq '.files | length' <<<"$compare")
          newer=$(jq -r '.files[].filename' <<<"$compare" | grep -cE "$CI_PATHS" || true)
          # The compare API lists at most 300 files; treat a full list as touching CI paths.
          if [ "$status" = ahead ] && [ "$newer" -eq 0 ] && [ "$count" -lt 300 ]; then
            echo "main is at $tip; the newer commits after $SHA do not run CI, so $SHA deploys."
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Skipping deploy of $SHA: main is at $tip ($status, $newer newer CI file changes); its own deploy follows."
          echo "deploy=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.order.outputs.deploy == 'true'
        with:
          ref: ${{ env.SHA }}

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        if: steps.order.outputs.deploy == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        if: steps.order.outputs.deploy == 'true'
        run: az acr login --name "${{ vars.ACR_NAME }}"

      # A tag, once pushed, names one image: a rebuild would move it and break rollback to it.
      - name: Check whether this commit's image is already in the registry
        id: existing
        if: steps.order.outputs.deploy == 'true'
        run: |
          if az acr repository show --name "${{ vars.ACR_NAME }}" --image "interviewcheck-web:$SHA" --output none 2>/dev/null; then
            echo "$IMAGE is already in the registry; not rebuilding it."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.order.outputs.deploy == 'true' && steps.existing.outputs.found != 'true'

      - name: Build and push the image
        if: steps.order.outputs.deploy == 'true' && steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ env.SHA }}
            PUBLIC_ORIGIN=https://${{ vars.SITE_ADDRESS }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The rollout's own success criteria include HTTPS through Caddy on the VM; any failure there
      # rolls back on the VM (deploy/vm-rollout.sh), which is the only rollback path.
      - name: Roll out on the VM
        if: steps.order.outputs.deploy == 'true'
        run: |
          {
            echo "IMAGE=$IMAGE"
            echo "ACR=${{ vars.ACR_NAME }}"
            echo "SITE_ADDRESS=${{ vars.SITE_ADDRESS }}"
            echo "BACKUP_ACCOUNT=${{ vars.BACKUP_ACCOUNT }}"
            echo "COMPOSE_B64=$(base64 -w0 deploy/compose.yml)"
            echo "CADDY_B64=$(base64 -w0 deploy/Caddyfile)"
            echo "BACKUP_B64=$(base64 -w0 deploy/backup.sh)"
            cat deploy/vm-rollout.sh
          } > "$RUNNER_TEMP/rollout.sh"
          out=$(az vm run-command invoke -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.VM_NAME }}" \
            --command-id RunShellScript --scripts "@$RUNNER_TEMP/rollout.sh" --query "value[0].message" -o tsv)
          echo "$out"
          grep -q ROLLOUT_OK <<<"$out" || { echo "::error::Rollout failed on the VM (see log above)."; exit 1; }

      # From outside Azure: DNS, the network security group and the certificate as visitors see them.
      - name: Check the public site
        if: steps.order.outputs.deploy == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.SITE_ADDRESS }}/api/readyz" && curl -fsS -o /dev/null "https://${{ vars.SITE_ADDRESS }}/"; then
              echo; echo "Live: https://${{ vars.SITE_ADDRESS }} ($SHA)"; exit 0
            fi
            sleep 6
          done
          echo "::error::https://${{ vars.SITE_ADDRESS }} did not answer from outside Azure; the VM reported a healthy rollout, so check DNS and the network security group."; exit 1

      # Fails the run without rolling back: the new version is healthy, and a finding here is for a person.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.order.outputs.deploy == 'true'
        with:
          python-version: "3.13"

      - name: Check the security controls at the edge
        if: steps.order.outputs.deploy == 'true'
        run: |
          python -m pip install --quiet "$(grep -E '^httpx==' portable/requirements.txt)"
          python scripts/verify_edge_security.py --base-url "https://${{ vars.SITE_ADDRESS }}" --edge
