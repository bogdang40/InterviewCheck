name: memanager

options:
  bundleIdPrefix: com.interviewcheck
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: memanager
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: "$(MEMANAGER_DEVELOPMENT_TEAM)"
    CLANG_ENABLE_MODULES: YES

targets:
  memanager:
    type: application
    platform: macOS
    sources:
      - path: memanager
        excludes:
          - "*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: memanager/Info.plist
        CODE_SIGN_ENTITLEMENTS: memanager/memanager.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.interviewcheck.app
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: Verify Entitlements
        script: |
          "${SRCROOT}/scripts/verify-entitlements.sh"
    entitlements:
      path: memanager/memanager.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true

  memanagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: memanagerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: memanagerTests
        PRODUCT_BUNDLE_IDENTIFIER: com.interviewcheck.tests
    dependencies:
      - target: memanager

schemes:
  memanager:
    build:
      targets:
        memanager: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - memanagerTests
    archive:
      config: Release
