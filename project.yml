name: InterviewCheck

options:
  bundleIdPrefix: com.interviewcheck
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: InterviewCheck
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: "$(INTERVIEWCHECK_DEVELOPMENT_TEAM)"
    CLANG_ENABLE_MODULES: YES

targets:
  InterviewCheck:
    type: application
    platform: macOS
    sources:
      - path: InterviewCheck
        excludes:
          - "*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: InterviewCheck/Info.plist
        CODE_SIGN_ENTITLEMENTS: InterviewCheck/InterviewCheck.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.interviewcheck.app
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: Verify Entitlements
        script: |
          "${SRCROOT}/scripts/verify-entitlements.sh"
    entitlements:
      path: InterviewCheck/InterviewCheck.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true

  InterviewCheckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: InterviewCheckTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: InterviewCheckTests
        PRODUCT_BUNDLE_IDENTIFIER: com.interviewcheck.tests
    dependencies:
      - target: InterviewCheck

schemes:
  InterviewCheck:
    build:
      targets:
        InterviewCheck: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - InterviewCheckTests
    archive:
      config: Release
